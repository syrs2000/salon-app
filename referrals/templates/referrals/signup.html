<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 | {{ partner.name }}様のご紹介</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm" style="max-width: 500px; margin: 0 auto;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">エステ会員登録</h4>
            
            <div class="alert alert-info text-center" role="alert">
                <strong>{{ partner.name }}</strong> 様からのご紹介<br>
                ありがとうございます！
            </div>

            <form method="post">
                {% csrf_token %}
                
               <div class="mb-3">
                    <label class="form-label">お名前（ニックネーム可）</label>
                    {{ form.name }}
                    <div class="form-text text-muted">
                        本名は不要です。お店で判別できるお名前を入力してください。
                    </div>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">登録する</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
